<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Личный сайт. Резюме и проекты скоро появятся здесь.">
  <meta name="theme-color" content="#010102">
  <title>Резюме — скоро</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1011'/%3E%3Cpath d='M20 16h17l9 9v23H20z' fill='none' stroke='%235e6ad2' stroke-width='4' stroke-linejoin='round'/%3E%3Cpath d='M27 33h12M27 40h8' stroke='%23f7f8f8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme: dark; --canvas:#010102; --panel:#0f1011; --ink:#f7f8f8; --muted:#8a8f98; --border:#23252a; --accent:#5e6ad2; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--canvas); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    .page { min-height:100svh; max-width:1280px; margin:auto; padding:32px 48px; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; gap:12px; font-size:14px; font-weight:500; }
    .mark { width:32px; height:32px; color:var(--accent); }
    main { flex:1; display:grid; align-content:center; padding:80px 0; }
    .card { width:min(100%,880px); padding:48px; border:1px solid var(--border); border-radius:16px; background:var(--panel); }
    .status { display:inline-flex; align-items:center; gap:8px; margin:0 0 32px; color:#d0d6e0; font-size:12px; padding:6px 12px; background:#141516; border:1px solid var(--border); border-radius:999px; }
    .status span { width:6px; height:6px; border-radius:50%; background:var(--muted); }
    h1 { margin:0; max-width:720px; font-size:clamp(36px,5.6vw,64px); line-height:1.1; letter-spacing:-1.8px; font-weight:600; text-wrap:balance; }
    .description { margin:24px 0 0; max-width:520px; font-size:18px; line-height:1.5; color:var(--muted); text-wrap:pretty; }
    .line { width:48px; height:1px; background:#34343a; margin:48px 0 24px; }
    .note { margin:0; font-size:14px; line-height:1.5; color:var(--muted); }
    footer { display:flex; justify-content:space-between; gap:16px; color:var(--muted); font-size:12px; line-height:1.5; }
    /* Kinetics Stagger Entrance: 14px rise, .45s easing, 90ms stagger. */
    .reveal { animation:entrance .45s cubic-bezier(.16,1,.3,1) both; animation-delay:calc(var(--order,0) * 90ms); }
    @keyframes entrance { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:translateY(0); } }
    @media(max-width:600px) { .page { padding:24px; } main { padding:48px 0; } .card { padding:32px 24px; } h1 { letter-spacing:-1px; } .description { font-size:16px; } .line { margin-top:32px; } footer { flex-wrap:wrap; } }
    @media(prefers-reduced-motion:reduce) { .reveal { animation:none; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="reveal">
      <svg class="mark" aria-hidden="true" viewBox="0 0 32 32" fill="none"><path d="M9 5h10l5 5v17H9V5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M19 5v6h5M13 16h7M13 21h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Личный сайт</span>
    </header>
    <main>
      <section class="card" aria-labelledby="title">
        <p class="status reveal" style="--order:1"><span aria-hidden="true"></span>В процессе создания</p>
        <h1 id="title" class="reveal" style="--order:2">Скоро здесь —<br>моё резюме.</h1>
        <p class="description reveal" style="--order:3">Опыт, навыки и проекты.<br>Всё важное обо мне на одной странице.</p>
        <div class="line reveal" style="--order:4" aria-hidden="true"></div>
        <p class="note reveal" style="--order:4">Сайт готовится. Загляните чуть позже.</p>
      </section>
    </main>
    <footer class="reveal" style="--order:5"><span>Резюме · Портфолио</span><span>Скоро</span></footer>
  </div>
</body>
</html>
