  <script>
    (() => {
      const set = lang => {
        const en = lang === 'en';
        document.documentElement.lang = lang;
        document.title = en ? 'Page not found — Denis Berzhanin' : 'Страница не найдена — Денис Бержанин';
        document.querySelectorAll('[data-ru]').forEach(el => { el.textContent = el.dataset[lang]; });

        document.querySelectorAll('[data-ru-label]').forEach(el => el.setAttribute('aria-label', el.dataset[lang + 'Label']));
        document.querySelector('[data-home]').href = en ? '/en/' : '/';
        document.querySelector('[data-home]').setAttribute('aria-label', en ? 'Denis Berzhanin — home' : 'Денис Бержанин — на главную');
        document.querySelector('.lang-switch').setAttribute('aria-label', en ? 'Page language' : 'Язык страницы');
        document.querySelectorAll('[data-lang]').forEach(el => el.toggleAttribute('aria-current', el.dataset.lang === lang));
        document.querySelector('.not-found-en').hidden = true;
      };
      set(location.pathname.startsWith('/en/') ? 'en' : 'ru');
      // On this page the switch changes the language in place instead of leaving it.
      document.querySelectorAll('[data-lang]').forEach(el => el.addEventListener('click', event => {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        set(el.dataset.lang);
      }));
    })();
